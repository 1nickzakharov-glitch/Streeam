<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streeam — Clean Developer Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap');

        :root {
            /* Чистый глубокий чёрный фон */
            --bg-term: #000000;
            --bg-header: #050505;
            
            /* Цвета текста и заливок (БЕЗ ОБВОДОК) */
            --text-main: #d4d4d8;
            --text-dim: #71717a;
            --text-muted: #52525b;
            
            --user-cyan: #00d2ff;
            --user-bg: rgba(0, 210, 255, 0.08);
            
            --green-done: #10b981;
            --green-bg: rgba(16, 185, 129, 0.12);
            
            /* Натуральный пропорциональный шрифт как в интерфейсах macOS/Pi */
            --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", sans-serif;
            --font-code: "SF Mono", Menlo, Monaco, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: transparent;
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Никаких жестких обводок, чистый минималистичный блок */
        .terminal-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-term);
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95);
            position: relative;
            overflow: hidden;
        }

        /* Верхняя панель */
        .terminal-header {
            flex-shrink: 0;
            background: var(--bg-header);
            padding: 11px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .window-dots {
            display: flex;
            align-items: center;
            gap: 6.5px;
        }

        .dot {
            width: 9.5px;
            height: 9.5px;
            border-radius: 50%;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .terminal-title {
            font-size: 12.5px;
            font-weight: 500;
            letter-spacing: -0.1px;
            color: #e4e4e7;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .prompt-symbol {
            color: #00d2ff;
            font-weight: 600;
        }

        .project-tag {
            font-size: 10.5px;
            font-weight: 500;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(0, 210, 255, 0.12);
            color: #38bdf8;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .source-filters {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: #71717a;
            font-family: var(--font-ui);
            font-size: 11px;
            font-weight: 500;
            padding: 2px 7px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .filter-btn:hover {
            color: #f4f4f5;
        }

        .filter-btn.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 8px;
            background: var(--green-bg);
            border-radius: 12px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 6px #10b981;
            animation: pulseDot 2s infinite;
        }

        .status-text {
            font-size: 10px;
            font-weight: 600;
            color: #34d399;
            letter-spacing: 0.3px;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.15); }
        }

        /* Лента сообщений: свободные отступы между карточками, плотное аккуратное межстрочное */
        .terminal-stream {
            flex: 1;
            padding: 20px 22px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 22px; /* Просторные комфортные отступы между записями */
            scroll-behavior: smooth;
            scrollbar-width: none;
            padding-bottom: 110px; /* Свободное место для питомца внизу */
        }

        .terminal-stream::-webkit-scrollbar {
            display: none;
        }

        .log-entry {
            display: flex;
            flex-direction: column;
            gap: 5px;
            animation: fadeIn 0.16s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-dim);
        }

        .time-text {
            color: #52525b;
            font-size: 10.5px;
            font-family: var(--font-code);
        }

        .badge {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            padding: 1px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            color: #a1a1aa;
        }

        /* Плотное, натуральное межстрочное расстояние без моноширинности */
        .title-text {
            font-size: 13.5px;
            line-height: 1.38; /* Аккуратное читабельное межстрочное */
            color: #a1a1aa;    /* Спокойный терминальный серый */
            font-weight: 400;
            letter-spacing: -0.15px;
            word-break: break-word;
        }

        /* 1. Сообщение пользователя: ТОЛЬКО мягкая заливка, БЕЗ ОБВОДКИ */
        .log-user {
            background: var(--user-bg);
            border-radius: 7px;
            padding: 12px 16px;
        }

        .log-user .badge {
            background: rgba(0, 210, 255, 0.2);
            color: #38bdf8;
        }

        .log-user .title-text {
            color: #f0f9ff;
            font-weight: 450;
            font-size: 14px;
            line-height: 1.38;
        }

        /* 2. Завершенный шаг: чистая зеленая заливка галочки, БЕЗ ОБВОДОК */
        .log-done .title-text {
            color: #6ee7b7;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .check-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            margin-top: 1px;
            flex-shrink: 0;
        }

        /* Нижняя строка */
        .terminal-footer {
            flex-shrink: 0;
            padding: 8px 18px;
            background: #030304;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: #71717a;
        }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 13px;
            background: #a1a1aa;
            vertical-align: middle;
            margin-left: 4px;
            animation: blink 1s step-start infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* =========================================================
           ВЫСОКОДЕТАЛИЗИРОВАННЫЙ МИЛЫЙ ПИКСЕЛЬНЫЙ ПИТОМЕЦ (Bottom Right)
           ========================================================= */
        .pixel-buddy-wrapper {
            position: absolute;
            bottom: 28px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
            z-index: 30;
        }

        .pet-speech-cloud {
            background: #14161f;
            border-radius: 6px;
            padding: 4px 9px;
            font-size: 10px;
            font-weight: 500;
            color: #38bdf8;
            margin-bottom: 6px;
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
            animation: petBounce 3s ease-in-out infinite;
        }

        @keyframes petBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2.5px); }
        }

        /* Крупный, высокодетализированный питомец */
        .pixel-pet {
            width: 100px;
            height: 80px;
            position: relative;
            image-rendering: pixelated;
        }

        /* Рабочий стол */
        .pet-desk {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100px;
            height: 16px;
            background: #18181b;
            border-radius: 3px;
        }

        /* Монитор с эффектом свечения */
        .pet-pc {
            position: absolute;
            bottom: 15px;
            left: 8px;
            width: 38px;
            height: 30px;
            background: #27272a;
            border-radius: 4px;
            box-shadow: 0 0 16px rgba(0, 210, 255, 0.15);
        }

        .pet-screen {
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            background: #050811;
            border-radius: 2px;
            overflow: hidden;
        }

        .screen-line-1 {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 2px;
            background: #00d2ff;
            box-shadow: 0 0 4px #00d2ff;
            animation: codeType1 1.2s infinite steps(3);
        }

        .screen-line-2 {
            position: absolute;
            top: 8px;
            left: 3px;
            width: 26px;
            height: 2px;
            background: #10b981;
            box-shadow: 0 0 4px #10b981;
            animation: codeType2 0.85s infinite steps(4);
        }

        .screen-line-3 {
            position: absolute;
            top: 13px;
            left: 3px;
            width: 14px;
            height: 2px;
            background: #c084fc;
            box-shadow: 0 0 4px #c084fc;
            animation: codeType1 1.4s infinite steps(2);
        }

        .screen-line-4 {
            position: absolute;
            top: 18px;
            left: 3px;
            width: 20px;
            height: 2px;
            background: #f59e0b;
            box-shadow: 0 0 4px #f59e0b;
            animation: codeType2 1.1s infinite steps(3);
        }

        @keyframes codeType1 { 50% { width: 8px; } }
        @keyframes codeType2 { 50% { width: 15px; } }

        .pet-pc-stand {
            position: absolute;
            bottom: 10px;
            left: 22px;
            width: 10px;
            height: 6px;
            background: #3f3f46;
            border-radius: 1px;
        }

        /* Милый детализированный кибер-котик */
        .pet-creature {
            position: absolute;
            bottom: 14px;
            right: 8px;
            width: 44px;
            height: 48px;
            animation: creatureBreathe 2.5s ease-in-out infinite;
        }

        @keyframes creatureBreathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-1.5px); }
        }

        /* Ушки с розовой серединкой */
        .pet-ear-left {
            position: absolute;
            top: 0;
            left: 5px;
            width: 11px;
            height: 11px;
            background: #3b82f6;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        .pet-ear-left::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 2px;
            width: 7px;
            height: 7px;
            background: #f472b6;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .pet-ear-right {
            position: absolute;
            top: 0;
            right: 5px;
            width: 11px;
            height: 11px;
            background: #3b82f6;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        .pet-ear-right::after {
            content: '';
            position: absolute;
            top: 3px;
            right: 2px;
            width: 7px;
            height: 7px;
            background: #f472b6;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        /* Голова котика */
        .pet-head {
            position: absolute;
            top: 7px;
            left: 3px;
            width: 38px;
            height: 27px;
            background: #2563eb;
            border-radius: 7px;
        }

        /* Большие выразительные глаза */
        .pet-eyes {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            display: flex;
            justify-content: space-between;
        }

        .pet-eye {
            width: 8.5px;
            height: 10px;
            background: #020617;
            border-radius: 3px;
            position: relative;
            animation: petBlink 3.8s infinite;
        }

        .pet-eye::before {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            width: 4px;
            height: 4px;
            background: #ffffff;
            border-radius: 2px;
        }

        .pet-eye::after {
            content: '';
            position: absolute;
            bottom: 1.5px;
            right: 1.5px;
            width: 2px;
            height: 2px;
            background: #38bdf8;
            border-radius: 50%;
        }

        @keyframes petBlink {
            0%, 94%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.1); }
        }

        /* Румяные щёчки */
        .pet-cheeks {
            position: absolute;
            bottom: 3px;
            left: 4px;
            right: 4px;
            display: flex;
            justify-content: space-between;
        }

        .pet-cheek {
            width: 6px;
            height: 4px;
            background: #f472b6;
            border-radius: 2px;
            opacity: 0.85;
        }

        /* Маленький носик */
        .pet-nose {
            position: absolute;
            bottom: 7px;
            left: 17px;
            width: 4px;
            height: 2.5px;
            background: #fbcfe8;
            border-radius: 2px;
        }

        /* Тельце */
        .pet-body {
            position: absolute;
            bottom: 0;
            left: 7px;
            width: 30px;
            height: 19px;
            background: #1d4ed8;
            border-radius: 6px;
        }

        /* Лапки печатают */
        .pet-paws {
            position: absolute;
            bottom: 2px;
            left: -4px;
            display: flex;
            gap: 10px;
            z-index: 5;
        }

        .pet-paw {
            width: 8px;
            height: 6px;
            background: #60a5fa;
            border-radius: 3px;
            animation: pawTyping 0.2s infinite alternate ease-in-out;
        }

        .pet-paw.right {
            animation-delay: 0.1s;
        }

        @keyframes pawTyping {
            0% { transform: translateY(0); }
            100% { transform: translateY(3px); }
        }

        /* Хвост */
        .pet-tail {
            position: absolute;
            bottom: 5px;
            right: -7px;
            width: 10px;
            height: 6px;
            background: #3b82f6;
            border-radius: 4px;
            animation: tailWiggle 1.4s ease-in-out infinite alternate;
        }

        @keyframes tailWiggle {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(24deg) translateY(-3px); }
        }

        /* Canvas Confetti */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <!-- Confetti layer for milestone celebration -->
        <canvas id="confetti-canvas"></canvas>

        <!-- Header -->
        <div class="terminal-header">
            <div class="header-left">
                <div class="window-dots">
                    <div class="dot dot-red"></div>
                    <div class="dot dot-yellow"></div>
                    <div class="dot dot-green"></div>
                </div>
                <span class="terminal-title"><span class="prompt-symbol">❯</span> streeam</span>
                <span class="project-tag" id="project-tag">MULTI-AGENT</span>
            </div>
            <div class="header-right">
                <div class="source-filters">
                    <button class="filter-btn active" onclick="setFilter('all')">all</button>
                    <button class="filter-btn" onclick="setFilter('pi')">orca</button>
                    <button class="filter-btn" onclick="setFilter('claude')">claude</button>
                    <button class="filter-btn" onclick="setFilter('codex')">codex</button>
                    <button class="filter-btn" onclick="setFilter('tmux')">tmux</button>
                </div>
                <div class="status-pill">
                    <span class="status-dot"></span>
                    <span class="status-text">LIVE</span>
                </div>
            </div>
        </div>

        <!-- Terminal Stream -->
        <div class="terminal-stream" id="stream-container">
            <!-- Dynamic entries -->
        </div>

        <!-- Highly detailed animated pixel pet -->
        <div class="pixel-buddy-wrapper">
            <div class="pet-speech-cloud" id="buddy-speech">coding live... ⚡</div>
            <div class="pixel-pet">
                <div class="pet-desk"></div>
                <div class="pet-pc-stand"></div>
                <div class="pet-pc">
                    <div class="pet-screen">
                        <div class="screen-line-1"></div>
                        <div class="screen-line-2"></div>
                        <div class="screen-line-3"></div>
                        <div class="screen-line-4"></div>
                    </div>
                </div>
                
                <div class="pet-creature">
                    <div class="pet-tail"></div>
                    <div class="pet-ear-left"></div>
                    <div class="pet-ear-right"></div>
                    <div class="pet-head">
                        <div class="pet-eyes">
                            <div class="pet-eye"></div>
                            <div class="pet-eye"></div>
                        </div>
                        <div class="pet-cheeks">
                            <div class="pet-cheek"></div>
                            <div class="pet-cheek"></div>
                        </div>
                        <div class="pet-nose"></div>
                    </div>
                    <div class="pet-body"></div>
                    <div class="pet-paws">
                        <div class="pet-paw"></div>
                        <div class="pet-paw right"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Terminal Footer -->
        <div class="terminal-footer">
            <span id="footer-count">● 0 entries logged</span>
            <span>ready <span class="cursor"></span></span>
        </div>
    </div>

    <script>
        let rawEvents = [];
        let activeFilter = 'all';
        let lastEventCount = 0;

        const container = document.getElementById('stream-container');
        const projectTag = document.getElementById('project-tag');
        const footerCount = document.getElementById('footer-count');
        const buddySpeech = document.getElementById('buddy-speech');

        // Минималистичная SVG галочка с мягкой заливкой БЕЗ обводки
        const checkSvg = `
            <svg class="check-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="8" cy="8" r="8" fill="rgba(16, 185, 129, 0.2)"/>
                <path d="M4.8 8.2L6.9 10.3L11.2 5.8" stroke="#10b981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        `;

        function setFilter(source) {
            activeFilter = source;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const text = btn.innerText.toLowerCase();
                btn.classList.toggle('active', text === source || (source === 'pi' && text === 'orca'));
            });
            render();
        }

        function render() {
            container.innerHTML = '';
            const filtered = activeFilter === 'all'
                ? rawEvents
                : rawEvents.filter(ev => ev.source === activeFilter || (activeFilter === 'pi' && (ev.source === 'orca' || ev.source === 'pi')));

            filtered.forEach(ev => {
                const type = ev.type || 'action';
                const div = document.createElement('div');
                div.className = `log-entry log-${type}`;

                const badgeText = ev.badge || (type === 'user' ? 'USER PROMPT' : 'ACTION');
                const isDone = type === 'done';

                div.innerHTML = `
                    <div class="log-meta">
                        <span class="badge">${badgeText}</span>
                        <span class="time-text">${ev.time || ''}</span>
                    </div>
                    <div class="title-text">${isDone ? checkSvg : ''}${escapeHtml(ev.title || '')}</div>
                `;
                container.appendChild(div);
            });

            if (footerCount) {
                footerCount.innerText = `● ${filtered.length} entries streamed`;
            }

            container.scrollTop = container.scrollHeight;

            // Конфетти при завершении этапа
            if (rawEvents.length > lastEventCount && rawEvents.length > 0) {
                const latest = rawEvents[rawEvents.length - 1];
                if (latest.type === 'done') {
                    triggerMiniConfetti();
                    if (buddySpeech) buddySpeech.innerText = 'task completed! 🎉';
                    setTimeout(() => { if (buddySpeech) buddySpeech.innerText = 'coding live... ⚡'; }, 3500);
                }
            }
            lastEventCount = rawEvents.length;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ============================================
        // Canvas Confetti
        // ============================================
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerMiniConfetti() {
            const colors = ['#00d2ff', '#10b981', '#c084fc', '#f59e0b', '#f472b6'];
            for (let i = 0; i < 35; i++) {
                particles.push({
                    x: canvas.width / 2 + (Math.random() * 90 - 45),
                    y: canvas.height * 0.35 + (Math.random() * 40 - 20),
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 1.2) * 4.5,
                    size: Math.random() * 3.5 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.012,
                });
            }
            if (particles.length <= 35) animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(idx, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
            });

            if (particles.length > 0) {
                requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function connect() {
            const ws = new WebSocket('ws://' + window.location.host + '/ws');

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.project) projectTag.innerText = data.project;
                    if (Array.isArray(data.events)) {
                        rawEvents = data.events;
                        render();
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            ws.onclose = () => {
                setTimeout(connect, 1500);
            };
        }

        connect();
    </script>
</body>
</html>
