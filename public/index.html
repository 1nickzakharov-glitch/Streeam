<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streeam — Live Dev Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');

        :root {
            --bg-term: #000000;
            --bg-header: #050505;
            
            --text-main: #e4e4e7;
            --text-meta: rgba(255, 255, 255, 0.40);
            
            --color-user: #00d2ff;   /* Яркий голубой */
            --color-plan: #c084fc;   /* Яркий фиолетовый */
            --color-action: #facc15; /* Яркий желтый */
            --color-done: #34d399;   /* Яркий зеленый */
            --color-system: #f87171; /* Яркий красный */

            --user-bg: rgba(0, 210, 255, 0.16);
            --green-bg: rgba(16, 185, 129, 0.14);
            
            --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", sans-serif;
            --font-code: "SF Mono", Menlo, Monaco, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: transparent;
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .terminal-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-term);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        /* Верхняя панель с брендингом STREEAM и логотипом */
        .terminal-header {
            flex-shrink: 0;
            background: var(--bg-header);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .window-dots {
            display: flex;
            align-items: center;
            gap: 6.5px;
        }

        .dot {
            width: 9.5px;
            height: 9.5px;
            border-radius: 50%;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        /* Фирменный логотип: мини-терминальчик с символом */
        .brand-block {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .terminal-logo-icon {
            width: 20px;
            height: 17px;
            background: #18181b;
            border: 1.5px solid #00d2ff;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.35);
        }

        .terminal-logo-prompt {
            color: #00d2ff;
            font-family: var(--font-code);
            font-size: 11px;
            font-weight: 800;
            line-height: 1;
            margin-top: -1px;
        }

        .brand-text {
            font-family: 'JetBrains Mono', var(--font-code);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.8px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .workspace-badge {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.4px;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
            color: #a1a1aa;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .source-filters {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: #71717a;
            font-family: var(--font-ui);
            font-size: 11px;
            font-weight: 500;
            padding: 2px 7px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .filter-btn:hover {
            color: #f4f4f5;
        }

        .filter-btn.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 8px;
            background: var(--green-bg);
            border-radius: 12px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 6px #10b981;
            animation: pulseDot 2s infinite;
        }

        .status-text {
            font-size: 10px;
            font-weight: 600;
            color: #34d399;
            letter-spacing: 0.3px;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.15); }
        }

        /* Лента сообщений */
        .terminal-stream {
            flex: 1;
            padding: 22px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
            scrollbar-width: none;
            padding-bottom: 140px;
        }

        .terminal-stream::-webkit-scrollbar {
            display: none;
        }

        /* Плавное добавление новых сообщений БЕЗ моргания */
        .log-entry {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 0 14px;
            margin: 0;
            opacity: 1;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        }

        .log-entry.new-item {
            animation: smoothSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes smoothSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            padding: 0;
            margin: 0;
        }

        .time-text {
            color: var(--text-meta);
            font-size: 10px;
            font-family: var(--font-code);
        }

        .badge {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            padding: 0;
            background: transparent !important;
        }

        .badge-user { color: var(--color-user); }
        .badge-plan { color: var(--color-plan); }
        .badge-action { color: var(--color-action); }
        .badge-done { color: var(--color-done); }
        .badge-system { color: var(--color-system); }

        .title-text {
            font-size: 13.5px;
            line-height: 1.38;
            color: var(--text-main);
            font-weight: 400;
            letter-spacing: -0.15px;
            word-break: break-word;
            padding: 0;
            margin: 0;
        }

        .log-user {
            background: var(--user-bg);
            border-radius: 8px;
            padding: 12px 14px;
            margin: 0;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.08);
        }

        .log-user .badge {
            color: var(--color-user);
        }

        .log-user .title-text {
            color: #ffffff;
            font-weight: 500;
            font-size: 14.5px;
        }

        .log-done .title-text {
            color: #6ee7b7;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .check-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            margin-top: 1px;
            flex-shrink: 0;
        }

        /* 
           ИНТЕРАКТИВНЫЙ ТЕРМИНАЛЬНЫЙ TODO-БЛОК ДЛЯ СТРИМА (как в терминале)
        */
        .todo-card {
            margin-top: 6px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            font-family: var(--font-code);
            font-size: 12.5px;
        }

        .todo-top-line {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 2px;
        }

        .todo-badge-title {
            color: #94a3b8;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .todo-progress-count {
            color: #38bdf8;
            font-size: 11.5px;
            font-weight: 600;
        }

        .todo-phase-name {
            color: #00d2ff;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .todo-item-row {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            line-height: 1.42;
        }

        .todo-item-row.done {
            color: #52525b;
            text-decoration: line-through;
        }

        .todo-item-row.pending {
            color: #e4e4e7;
        }

        .todo-icon-check {
            color: #10b981;
            font-weight: 800;
            flex-shrink: 0;
        }

        .todo-icon-circle {
            color: #38bdf8;
            font-weight: 800;
            flex-shrink: 0;
        }

        /* Нижняя строка */
        .terminal-footer {
            flex-shrink: 0;
            padding: 8px 20px;
            background: #030304;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: #71717a;
        }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 13px;
            background: #a1a1aa;
            vertical-align: middle;
            margin-left: 4px;
            animation: blink 1s step-start infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* =========================================================
           ОРИГИНАЛЬНЫЙ АНИМИРОВАННЫЙ BONGO CAT (Классический стримерский)
           ========================================================= */
        .pixel-buddy-wrapper {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
            z-index: 30;
        }

        .pet-speech-cloud {
            background: #11131a;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 500;
            color: #38bdf8;
            margin-bottom: 2px;
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.85);
            animation: petBounce 3.6s ease-in-out infinite;
        }

        @keyframes petBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        #cat-sprite-img {
            width: 100px;
            height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.9));
        }

        /* Canvas Confetti */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <!-- Confetti layer for milestone celebration -->
        <canvas id="confetti-canvas"></canvas>

        <!-- Header с логотипом STREEAM и жирным шрифтом -->
        <div class="terminal-header">
            <div class="header-left">
                <div class="window-dots">
                    <div class="dot dot-red"></div>
                    <div class="dot dot-yellow"></div>
                    <div class="dot dot-green"></div>
                </div>

                <!-- Брендинг Streeam: мини-терминальчик и жирный шрифт -->
                <div class="brand-block">
                    <div class="terminal-logo-icon">
                        <span class="terminal-logo-prompt">&gt;</span>
                    </div>
                    <span class="brand-text">STREEAM</span>
                </div>

                <span class="workspace-badge" id="project-tag">MULTI-AGENT</span>
            </div>
            <div class="header-right">
                <div class="source-filters">
                    <button class="filter-btn active" onclick="setFilter('all')">all</button>
                    <button class="filter-btn" onclick="setFilter('pi')">orca</button>
                    <button class="filter-btn" onclick="setFilter('claude')">claude</button>
                    <button class="filter-btn" onclick="setFilter('codex')">codex</button>
                    <button class="filter-btn" onclick="setFilter('tmux')">tmux</button>
                </div>
                <div class="status-pill">
                    <span class="status-dot"></span>
                    <span class="status-text">LIVE</span>
                </div>
            </div>
        </div>

        <!-- Terminal Stream -->
        <div class="terminal-stream" id="stream-container">
            <!-- Dynamic entries -->
        </div>

        <!-- Bongo Cat / Coding Pet -->
        <div class="pixel-buddy-wrapper">
            <div class="pet-speech-cloud" id="buddy-speech">coding live... ⚡</div>
            <img id="cat-sprite-img" src="bongo-frame1.png" alt="Bongo Cat" />
        </div>

        <!-- Terminal Footer -->
        <div class="terminal-footer">
            <span id="footer-count">● 0 entries logged</span>
            <span>ready <span class="cursor"></span></span>
        </div>
    </div>

    <script>
        let rawEvents = [];
        let renderedEventIds = new Set();
        let activeFilter = 'all';

        const container = document.getElementById('stream-container');
        const projectTag = document.getElementById('project-tag');
        const footerCount = document.getElementById('footer-count');
        const buddySpeech = document.getElementById('buddy-speech');
        const catImg = document.getElementById('cat-sprite-img');

        const checkSvg = `
            <svg class="check-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="8" cy="8" r="8" fill="rgba(16, 185, 129, 0.2)"/>
                <path d="M4.8 8.2L6.9 10.3L11.2 5.8" stroke="#10b981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        `;

        function setFilter(source) {
            activeFilter = source;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const text = btn.innerText.toLowerCase();
                btn.classList.toggle('active', text === source || (source === 'pi' && text === 'orca'));
            });
            renderedEventIds.clear();
            container.innerHTML = '';
            renderEvents(true);
        }

        // Рендер БЕЗ моргания: только новые строки плавно анимируются
        function renderEvents(isFilterSwitch = false) {
            const filtered = activeFilter === 'all'
                ? rawEvents
                : rawEvents.filter(ev => ev.source === activeFilter || (activeFilter === 'pi' && (ev.source === 'orca' || ev.source === 'pi')));

            filtered.forEach(ev => {
                if (renderedEventIds.has(ev.id)) return;

                renderedEventIds.add(ev.id);
                const type = ev.type || 'action';
                const div = document.createElement('div');
                div.className = `log-entry log-${type} ${isFilterSwitch ? '' : 'new-item'}`;
                div.id = `msg-${ev.id}`;

                const badgeText = ev.badge || (type === 'user' ? 'USER PROMPT' : 'AGENT ACTION');
                const isDone = type === 'done';

                let todoHtml = '';
                if (ev.meta && ev.meta.kind === 'todo_list' && Array.isArray(ev.meta.items)) {
                    const doneCount = ev.meta.items.filter(i => i.done).length;
                    const totalCount = ev.meta.items.length;

                    const itemsHtml = ev.meta.items.map(it => `
                        <div class="todo-item-row ${it.done ? 'done' : 'pending'}">
                            <span class="${it.done ? 'todo-icon-check' : 'todo-icon-circle'}">${it.done ? '✓' : '○'}</span>
                            <span>${escapeHtml(it.text)}</span>
                        </div>
                    `).join('');

                    todoHtml = `
                        <div class="todo-card">
                            <div class="todo-top-line">
                                <span class="todo-badge-title">Todo</span>
                                <span class="todo-progress-count">${doneCount}/${totalCount} done</span>
                            </div>
                            <div class="todo-phase-name">${escapeHtml(ev.meta.phase || 'Sprint Roadmap')}</div>
                            ${itemsHtml}
                        </div>
                    `;
                }

                div.innerHTML = `
                    <div class="log-meta">
                        <span class="badge badge-${type}">${badgeText}</span>
                        <span class="time-text">${ev.time || ''}</span>
                    </div>
                    <div class="title-text">${isDone ? checkSvg : ''}${escapeHtml(ev.title || '')}</div>
                    ${todoHtml}
                `;
                container.appendChild(div);
            });

            if (footerCount) {
                footerCount.innerText = `● ${filtered.length} entries streamed`;
            }

            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // =======================================================
        // ПЛАВНАЯ СПОКОЙНАЯ АНИМАЦИЯ КОТИКА BONGO CAT
        // =======================================================
        let bongoFrame = 1;

        setInterval(() => {
            bongoFrame = bongoFrame === 1 ? 2 : 1;
            catImg.src = bongoFrame === 1 ? 'bongo-frame1.png' : 'bongo-frame2.png';
        }, 360);

        function celebrateTask() {
            triggerMiniConfetti();
            if (buddySpeech) buddySpeech.innerText = 'milestone finished! 🎉';
            setTimeout(() => {
                if (buddySpeech) buddySpeech.innerText = 'coding live... ⚡';
            }, 4000);
        }

        // ============================================
        // Canvas Confetti
        // ============================================
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerMiniConfetti() {
            const colors = ['#00d2ff', '#10b981', '#c084fc', '#f59e0b', '#f472b6'];
            for (let i = 0; i < 35; i++) {
                particles.push({
                    x: canvas.width / 2 + (Math.random() * 90 - 45),
                    y: canvas.height * 0.35 + (Math.random() * 40 - 20),
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 1.2) * 4.5,
                    size: Math.random() * 3.5 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.012,
                });
            }
            if (particles.length <= 35) animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(idx, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
            });

            if (particles.length > 0) {
                requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function connect() {
            const ws = new WebSocket('ws://' + window.location.host + '/ws');

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.project) projectTag.innerText = data.project;
                    if (Array.isArray(data.events)) {
                        const prevCount = rawEvents.length;
                        rawEvents = data.events;
                        renderEvents(false);

                        if (rawEvents.length > prevCount && rawEvents.length > 0) {
                            const latest = rawEvents[rawEvents.length - 1];
                            if (latest.type === 'done') {
                                celebrateTask();
                            }
                        }
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            ws.onclose = () => {
                setTimeout(connect, 1500);
            };
        }

        connect();
    </script>
</body>
</html>
