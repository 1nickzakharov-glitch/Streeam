<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streeam — Real-time AI Stream HUD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

        :root {
            --bg-glass: rgba(10, 13, 20, 0.90);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --accent-green: #10b981;
            --accent-blue: #38bdf8;
            --accent-purple: #a855f7;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --font-ui: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: transparent;
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Outer HUD Frame */
        .overlay-card {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-glass);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            box-shadow: 
                0 24px 48px -12px rgba(0, 0, 0, 0.8),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.12);
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .overlay-header {
            flex-shrink: 0;
            padding: 12px 18px;
            background: rgba(15, 20, 32, 0.8);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 26px;
            height: 26px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 0 14px rgba(14, 165, 233, 0.5);
        }

        .brand-title {
            font-size: 13.5px;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .project-chip {
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 7px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 5px;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .source-tags {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tag-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 9.5px;
            padding: 2.5px 7px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
        }

        .tag-btn:hover, .tag-btn.active {
            background: rgba(56, 189, 248, 0.16);
            border-color: rgba(56, 189, 248, 0.4);
            color: var(--accent-blue);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 9px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulseDot 1.8s infinite;
        }

        .live-text {
            font-size: 10px;
            font-weight: 800;
            color: var(--accent-green);
            letter-spacing: 0.6px;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.7; }
        }

        /* Events Stream */
        .events-stream {
            flex: 1;
            padding: 16px 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 11px;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        .events-stream::-webkit-scrollbar {
            display: none;
        }

        .event-card {
            background: rgba(17, 24, 39, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            transition: all 0.2s ease;
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .event-card:hover {
            background: rgba(24, 32, 50, 0.9);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateX(2px);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .event-card::before {
            content: '';
            position: absolute;
            top: 10px;
            bottom: 10px;
            left: 0;
            width: 3.5px;
            border-radius: 0 3px 3px 0;
        }

        .type-user::before { background: var(--accent-blue); box-shadow: 0 0 10px var(--accent-blue); }
        .type-plan::before { background: var(--accent-purple); box-shadow: 0 0 10px var(--accent-purple); }
        .type-action::before { background: var(--accent-amber); box-shadow: 0 0 10px var(--accent-amber); }
        .type-done::before { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .type-system::before { background: var(--text-dim); }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
        }

        .meta-badges {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-source {
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .badge-kind {
            font-family: var(--font-mono);
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 4px;
        }

        .type-user .badge-kind { background: rgba(56, 189, 248, 0.16); color: var(--accent-blue); }
        .type-plan .badge-kind { background: rgba(168, 85, 247, 0.16); color: var(--accent-purple); }
        .type-action .badge-kind { background: rgba(245, 158, 11, 0.16); color: var(--accent-amber); }
        .type-done .badge-kind { background: rgba(16, 185, 129, 0.16); color: var(--accent-green); }
        .type-system .badge-kind { background: rgba(100, 116, 139, 0.16); color: var(--text-muted); }

        .time-label {
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--text-dim);
        }

        .card-body {
            font-size: 13.5px;
            line-height: 1.5;
            color: #e2e8f0;
            font-weight: 500;
            padding-left: 2px;
            word-break: break-word;
        }

        /* Footer */
        .overlay-footer {
            flex-shrink: 0;
            padding: 10px 18px;
            background: rgba(12, 16, 26, 0.9);
            border-top: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-dim);
            font-family: var(--font-mono);
        }

        .dock-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scroll-pill {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .pulse-bar {
            display: inline-block;
            width: 6px;
            height: 11px;
            background: var(--accent-blue);
            border-radius: 1px;
            animation: blinker 1s step-end infinite;
        }

        @keyframes blinker { 50% { opacity: 0; } }

        @media (max-height: 420px) {
            .overlay-header { padding: 8px 12px; }
            .overlay-footer { display: none; }
            .events-stream { padding: 10px; gap: 7px; }
            .event-card { padding: 8px 10px; }
            .card-body { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="overlay-card">
        <header class="overlay-header">
            <div class="header-brand">
                <div class="brand-icon">⚡</div>
                <div class="brand-title">
                    STREEAM
                    <span class="project-chip" id="current-project">MULTI-AGENT</span>
                </div>
            </div>

            <div class="header-controls">
                <div class="source-tags" id="source-filters">
                    <button class="tag-btn active" onclick="setFilter('all')">ALL</button>
                    <button class="tag-btn" onclick="setFilter('pi')">ORCA/PI</button>
                    <button class="tag-btn" onclick="setFilter('claude')">CLAUDE</button>
                    <button class="tag-btn" onclick="setFilter('codex')">CODEX</button>
                    <button class="tag-btn" onclick="setFilter('tmux')">TMUX</button>
                </div>
                <div class="live-indicator">
                    <span class="live-dot"></span>
                    <span class="live-text" id="status-text">LIVE</span>
                </div>
            </div>
        </header>

        <main class="events-stream" id="events-container">
        </main>

        <footer class="overlay-footer">
            <div class="dock-status">
                <span>● ADAPTER ENGINE LIVE</span>
                <span id="events-count" style="color: var(--text-muted);">0 events</span>
            </div>
            <div class="scroll-pill">
                <span>AUTO-SYNC</span>
                <span class="pulse-bar"></span>
            </div>
        </footer>
    </div>

    <script>
        let allEvents = [];
        let activeFilter = 'all';
        const container = document.getElementById('events-container');
        const projectEl = document.getElementById('current-project');
        const statusEl = document.getElementById('status-text');
        const countEl = document.getElementById('events-count');

        function setFilter(source) {
            activeFilter = source;
            document.querySelectorAll('.tag-btn').forEach(b => {
                b.classList.toggle('active', b.innerText.toLowerCase() === source || (source === 'pi' && b.innerText.includes('PI')));
            });
            render();
        }

        function render() {
            container.innerHTML = '';
            const filtered = activeFilter === 'all' 
                ? allEvents 
                : allEvents.filter(e => e.source === activeFilter || (activeFilter === 'pi' && (e.source === 'orca' || e.source === 'pi')));

            filtered.forEach(ev => {
                const card = document.createElement('div');
                const evType = ev.type || 'action';
                card.className = `event-card type-${evType}`;

                card.innerHTML = `
                    <div class="card-meta">
                        <div class="meta-badges">
                            <span class="badge-source">${ev.source || 'CLI'}</span>
                            <span class="badge-kind">${ev.badge || evType.toUpperCase()}</span>
                        </div>
                        <span class="time-label">${ev.time || ''}</span>
                    </div>
                    <div class="card-body">${escapeHtml(ev.title || '')}</div>
                `;
                container.appendChild(card);
            });

            if (countEl) countEl.innerText = `${filtered.length} events`;
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function connect() {
            const ws = new WebSocket('ws://' + window.location.host + '/ws');

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.project) projectEl.innerText = data.project;
                    if (data.status) statusEl.innerText = data.status;
                    if (Array.isArray(data.events)) {
                        allEvents = data.events;
                        render();
                    }
                } catch (err) {
                    console.error('Socket parse error:', err);
                }
            };

            ws.onclose = () => {
                setTimeout(connect, 1500);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        connect();
    </script>
</body>
</html>
