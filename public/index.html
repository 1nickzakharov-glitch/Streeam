<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streeam — Live Dev Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap');

        :root {
            --bg-term: #000000;
            --bg-header: #050505;
            
            --text-main: #e4e4e7;
            --text-meta: rgba(255, 255, 255, 0.40);
            
            --color-user: #00d2ff;   /* Яркий голубой */
            --color-plan: #c084fc;   /* Яркий фиолетовый */
            --color-action: #facc15; /* Яркий желтый */
            --color-done: #34d399;   /* Яркий зеленый */
            --color-system: #f87171; /* Яркий красный */

            --user-bg: rgba(0, 210, 255, 0.16);
            --green-bg: rgba(16, 185, 129, 0.14);
            
            /* ЕДИНЫЙ ШРИФТ ДЛЯ ВСЕХ СООБЩЕНИЙ И ПЛАНОВ */
            --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", sans-serif;
            --font-code: "SF Mono", Menlo, Monaco, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: transparent;
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .terminal-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-term);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        /* Верхняя панель с официальным логотипом Streeam */
        .terminal-header {
            flex-shrink: 0;
            background: var(--bg-header);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .window-dots {
            display: flex;
            align-items: center;
            gap: 6.5px;
        }

        .dot {
            width: 9.5px;
            height: 9.5px;
            border-radius: 50%;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        /* Фирменный логотип Streeam с лендинга */
        .brand-block {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo-img {
            width: 22px;
            height: 22px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .brand-text {
            font-family: 'JetBrains Mono', var(--font-code);
            font-size: 13.5px;
            font-weight: 800;
            letter-spacing: 0.8px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .workspace-badge {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.4px;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
            color: #a1a1aa;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .source-filters {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: #71717a;
            font-family: var(--font-ui);
            font-size: 11px;
            font-weight: 500;
            padding: 2px 7px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .filter-btn:hover {
            color: #f4f4f5;
        }

        .filter-btn.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 8px;
            background: var(--green-bg);
            border-radius: 12px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 6px #10b981;
            animation: pulseDot 2s infinite;
        }

        .status-text {
            font-size: 10px;
            font-weight: 600;
            color: #34d399;
            letter-spacing: 0.3px;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.15); }
        }

        /* 
           ОСНОВНАЯ ОБЛАСТЬ:
           Включает скроллируемый поток сообщений и закрепленный снизу активный план
        */
        .terminal-content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .terminal-stream {
            flex: 1;
            padding: 20px 20px 10px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        .terminal-stream::-webkit-scrollbar {
            display: none;
        }

        /* Плавное добавление новых сообщений БЕЗ моргания */
        .log-entry {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 0 14px;
            margin: 0;
            opacity: 1;
            position: relative;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        }

        .log-entry.new-item {
            animation: smoothSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes smoothSlideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .log-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            padding: 0;
            margin: 0;
        }

        .time-text {
            color: var(--text-meta);
            font-size: 10px;
            font-family: var(--font-code);
        }

        .badge {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            padding: 0;
            background: transparent !important;
        }

        .badge-user { color: var(--color-user); }
        .badge-plan { color: var(--color-plan); }
        .badge-action { color: var(--color-action); }
        .badge-done { color: var(--color-done); }
        .badge-system { color: var(--color-system); }

        .title-text {
            font-size: 13.5px;
            line-height: 1.38;
            color: var(--text-main);
            font-weight: 400;
            letter-spacing: -0.15px;
            word-break: break-word;
            padding: 0;
            margin: 0;
        }

        .log-user {
            background: var(--user-bg);
            border-radius: 8px;
            padding: 12px 14px;
            margin: 0;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.08);
        }

        .log-user .badge {
            color: var(--color-user);
        }

        .log-user .title-text {
            color: #ffffff;
            font-weight: 500;
            font-size: 14.5px;
        }

        .log-done .title-text {
            color: #6ee7b7;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .check-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            margin-top: 1px;
            flex-shrink: 0;
        }

        /* 
           ЗАКРЕПЛЕННЫЙ СНИЗУ АКТИВНЫЙ ПЛАН (ПОКА НЕ ВЫПОЛНЕН)
           Шрифт ТОЧНО ТАКОЙ ЖЕ как во всем интерфейсе!
        */
        .pinned-plan-container {
            flex-shrink: 0;
            padding: 10px 20px 14px 20px;
            background: rgba(5, 7, 10, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 15;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.85);
            display: none; /* Отображается динамически, когда план активен */
        }

        .todo-card {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-family: var(--font-ui); /* ЕДИНЫЙ ЧИСТЫЙ ШРИФТ */
            font-size: 13px;
        }

        .todo-top-line {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 2px;
        }

        .todo-badge-title {
            color: #94a3b8;
            font-weight: 700;
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .todo-progress-count {
            color: #38bdf8;
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font-code);
        }

        .todo-phase-name {
            color: #00d2ff;
            font-weight: 600;
            font-size: 13.5px;
            margin-bottom: 3px;
        }

        .todo-item-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.38;
            font-size: 13px;
        }

        .todo-item-row.done {
            color: #52525b;
            text-decoration: line-through;
        }

        .todo-item-row.pending {
            color: #d4d4d8;
        }

        .todo-icon-check {
            color: #10b981;
            font-weight: 700;
            flex-shrink: 0;
        }

        .todo-icon-circle {
            color: #38bdf8;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* Нижняя строка терминала */
        .terminal-footer {
            flex-shrink: 0;
            padding: 8px 20px;
            background: #030304;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: #71717a;
            position: relative;
            z-index: 20;
        }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 13px;
            background: #a1a1aa;
            vertical-align: middle;
            margin-left: 4px;
            animation: blink 1s step-start infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* =========================================================
           ПИТОМЕЦ С ПЕРЕКЛЮЧАТЕЛЕМ КОТОВ (В ПРАВОМ НИЖНЕМ УГЛУ)
           ========================================================= */
        .pixel-buddy-wrapper {
            position: absolute;
            bottom: 28px;
            right: 18px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 40;
        }

        .cat-switcher {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
            background: #11131a;
            border-radius: 4px;
            padding: 2px;
            pointer-events: auto;
        }

        .cat-switch-btn {
            background: transparent;
            border: none;
            color: #71717a;
            font-family: var(--font-code);
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .cat-switch-btn.active {
            background: #2563eb;
            color: #ffffff;
        }

        .pet-speech-cloud {
            background: #11131a;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 500;
            color: #38bdf8;
            margin-bottom: 2px;
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.85);
            animation: petBounce 3.6s ease-in-out infinite;
        }

        @keyframes petBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        #cat-sprite-img {
            width: 108px;
            height: 75px;
            object-fit: contain;
            image-rendering: pixelated;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.9));
        }

        /* Canvas Confetti */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <!-- Canvas конфетти прямо поверх сообщений -->
        <canvas id="confetti-canvas"></canvas>

        <!-- Header с официальным логотипом STREEAM с лендинга -->
        <div class="terminal-header">
            <div class="header-left">
                <div class="window-dots">
                    <div class="dot dot-red"></div>
                    <div class="dot dot-yellow"></div>
                    <div class="dot dot-green"></div>
                </div>

                <div class="brand-block">
                    <img class="brand-logo-img" src="streeam-logo.svg" alt="Streeam Logo" />
                    <span class="brand-text">STREEAM</span>
                </div>

                <span class="workspace-badge" id="project-tag">ORCA DEV</span>
            </div>
            <div class="header-right">
                <div class="source-filters">
                    <button class="filter-btn active" onclick="setFilter('all')">all</button>
                    <button class="filter-btn" onclick="setFilter('pi')">orca</button>
                    <button class="filter-btn" onclick="setFilter('claude')">claude</button>
                    <button class="filter-btn" onclick="setFilter('codex')">codex</button>
                    <button class="filter-btn" onclick="setFilter('tmux')">tmux</button>
                </div>
                <div class="status-pill">
                    <span class="status-dot"></span>
                    <span class="status-text">LIVE</span>
                </div>
            </div>
        </div>

        <!-- Контентная зона: сообщения приходят сверху, а план зафиксирован снизу -->
        <div class="terminal-content-area">
            <!-- Scrollable Terminal Stream (сообщения идут НАД планом) -->
            <div class="terminal-stream" id="stream-container">
                <!-- Dynamic log entries -->
            </div>

            <!-- ЗАКРЕПЛЕННЫЙ СНИЗУ АКТИВНЫЙ ПЛАН (ПОКА НЕ ВЫПОЛНЕН) -->
            <div class="pinned-plan-container" id="pinned-plan-box">
                <!-- Injected dynamically -->
            </div>
        </div>

        <!-- Переключатель котиков: Вариант 1 (Bongo Cat) или Вариант 4 (Black Neko) -->
        <div class="pixel-buddy-wrapper">
            <div class="cat-switcher">
                <button class="cat-switch-btn" id="btn-bongo" onclick="chooseCat('bongo')">1. Bongo</button>
                <button class="cat-switch-btn active" id="btn-black" onclick="chooseCat('black')">4. Black Neko</button>
            </div>
            <div class="pet-speech-cloud" id="buddy-speech">coding live... ⚡</div>
            <img id="cat-sprite-img" src="black-typing-1.png" alt="Stream Pet" />
        </div>

        <!-- Terminal Footer -->
        <div class="terminal-footer">
            <span id="footer-count">● 0 entries logged</span>
            <span>ready <span class="cursor"></span></span>
        </div>
    </div>

    <script>
        let rawEvents = [];
        let renderedEventIds = new Set();
        let activeFilter = 'all';
        let currentCatChoice = 'black'; // 'black' или 'bongo'

        // Текущее состояние активного плана
        let activeTodoPlan = null;

        const container = document.getElementById('stream-container');
        const pinnedPlanBox = document.getElementById('pinned-plan-box');
        const projectTag = document.getElementById('project-tag');
        const footerCount = document.getElementById('footer-count');
        const buddySpeech = document.getElementById('buddy-speech');
        const catImg = document.getElementById('cat-sprite-img');

        const checkSvg = `
            <svg class="check-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="8" cy="8" r="8" fill="rgba(16, 185, 129, 0.2)"/>
                <path d="M4.8 8.2L6.9 10.3L11.2 5.8" stroke="#10b981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        `;

        function chooseCat(choice) {
            currentCatChoice = choice;
            document.getElementById('btn-bongo').classList.toggle('active', choice === 'bongo');
            document.getElementById('btn-black').classList.toggle('active', choice === 'black');
        }

        function setFilter(source) {
            activeFilter = source;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const text = btn.innerText.toLowerCase();
                btn.classList.toggle('active', text === source || (source === 'pi' && text === 'orca'));
            });
            renderedEventIds.clear();
            container.innerHTML = '';
            renderEvents(true);
        }

        // Рендер без моргания
        function renderEvents(isFilterSwitch = false) {
            const filtered = activeFilter === 'all'
                ? rawEvents
                : rawEvents.filter(ev => ev.source === activeFilter || (activeFilter === 'pi' && (ev.source === 'orca' || ev.source === 'pi')));

            filtered.forEach(ev => {
                // Если это событие плана (todo_list), проверяем активен ли он или завершен
                if (ev.meta && ev.meta.kind === 'todo_list' && Array.isArray(ev.meta.items)) {
                    const allDone = ev.meta.items.every(i => i.done);
                    if (!allDone) {
                        // План еще выполняется: фиксируем его снизу!
                        activeTodoPlan = ev;
                        updatePinnedPlan(ev);
                        return; // Не добавляем его в общий поток пока не выполнен
                    } else {
                        // План полностью выполнен: скрываем из низа и пускаем в обычный поток
                        if (activeTodoPlan && activeTodoPlan.id === ev.id) {
                            pinnedPlanBox.style.display = 'none';
                            activeTodoPlan = null;
                        }
                    }
                }

                if (renderedEventIds.has(ev.id)) return;

                renderedEventIds.add(ev.id);
                const type = ev.type || 'action';
                const div = document.createElement('div');
                div.className = `log-entry log-${type} ${isFilterSwitch ? '' : 'new-item'}`;
                div.id = `msg-${ev.id}`;

                const badgeText = ev.badge || (type === 'user' ? 'USER PROMPT' : 'AGENT ACTION');
                const isDone = type === 'done';

                let todoHtml = '';
                if (ev.meta && ev.meta.kind === 'todo_list' && Array.isArray(ev.meta.items)) {
                    todoHtml = renderTodoCardHtml(ev);
                }

                div.innerHTML = `
                    <div class="log-meta">
                        <span class="badge badge-${type}">${badgeText}</span>
                        <span class="time-text">${ev.time || ''}</span>
                    </div>
                    <div class="title-text">${isDone ? checkSvg : ''}${escapeHtml(ev.title || '')}</div>
                    ${todoHtml}
                `;
                container.appendChild(div);
            });

            if (footerCount) {
                footerCount.innerText = `● ${filtered.length} entries streamed`;
            }

            container.scrollTop = container.scrollHeight;
        }

        // Рендер HTML карточки плана с единым шрифтом
        function renderTodoCardHtml(ev) {
            const doneCount = ev.meta.items.filter(i => i.done).length;
            const totalCount = ev.meta.items.length;

            const itemsHtml = ev.meta.items.map(it => `
                <div class="todo-item-row ${it.done ? 'done' : 'pending'}">
                    <span class="${it.done ? 'todo-icon-check' : 'todo-icon-circle'}">${it.done ? '✓' : '○'}</span>
                    <span>${escapeHtml(it.text)}</span>
                </div>
            `).join('');

            return `
                <div class="todo-card">
                    <div class="todo-top-line">
                        <span class="todo-badge-title">Todo Plan</span>
                        <span class="todo-progress-count">${doneCount}/${totalCount} done</span>
                    </div>
                    <div class="todo-phase-name">${escapeHtml(ev.meta.phase || 'Active Sprint')}</div>
                    ${itemsHtml}
                </div>
            `;
        }

        // Обновление зафиксированного снизу плана
        function updatePinnedPlan(ev) {
            pinnedPlanBox.style.display = 'block';
            pinnedPlanBox.innerHTML = renderTodoCardHtml(ev);
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // =======================================================
        // ПЛАВНАЯ СПОКОЙНАЯ АНИМАЦИЯ КОТИКА
        // =======================================================
        let petFrame = 1;

        setInterval(() => {
            petFrame = petFrame === 1 ? 2 : 1;
            if (currentCatChoice === 'bongo') {
                catImg.src = petFrame === 1 ? 'bongo-frame1.png' : 'bongo-frame2.png';
            } else {
                catImg.src = petFrame === 1 ? 'black-typing-1.png' : 'black-typing-2.png';
            }
        }, 480);

        function celebrateTask(cardEl) {
            triggerTargetedConfetti(cardEl);
            if (buddySpeech) buddySpeech.innerText = 'milestone finished! 🎉';
            setTimeout(() => {
                if (buddySpeech) buddySpeech.innerText = 'coding live... ⚡';
            }, 4000);
        }

        // ============================================
        // ТАРГЕТИРОВАННЫЕ КОНФЕТТИ ИМЕННО У СООБЩЕНИЯ
        // ============================================
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerTargetedConfetti(targetElement) {
            let originX = canvas.width / 2;
            let originY = canvas.height * 0.5;

            if (targetElement) {
                const rect = targetElement.getBoundingClientRect();
                const containerRect = canvas.getBoundingClientRect();
                originX = rect.left - containerRect.left + (rect.width * 0.35);
                originY = rect.top - containerRect.top + (rect.height * 0.5);
            }

            const colors = ['#00d2ff', '#10b981', '#c084fc', '#facc15', '#f43f5e', '#ffffff'];
            // 75 праздничных частиц, взлетающих прямо от сообщения
            for (let i = 0; i < 75; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2.5 + Math.random() * 6;
                particles.push({
                    x: originX,
                    y: originY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 2.8,
                    size: Math.random() * 4.5 + 2.5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.018 + 0.010,
                });
            }
            if (particles.length <= 75) animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.12;
                p.vx *= 0.98;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(idx, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
            });

            if (particles.length > 0) {
                requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function connect() {
            const ws = new WebSocket('ws://' + window.location.host + '/ws');

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.project) {
                        projectTag.innerText = data.project.toUpperCase();
                    }
                    if (Array.isArray(data.events)) {
                        const prevCount = rawEvents.length;
                        rawEvents = data.events;
                        renderEvents(false);

                        if (rawEvents.length > prevCount && rawEvents.length > 0) {
                            const latest = rawEvents[rawEvents.length - 1];
                            if (latest.type === 'done') {
                                const cardEl = document.getElementById(`msg-${latest.id}`);
                                celebrateTask(cardEl);
                            }
                        }
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            ws.onclose = () => {
                setTimeout(connect, 1500);
            };
        }

        connect();
    </script>
</body>
</html>
