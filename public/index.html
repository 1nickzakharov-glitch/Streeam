<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Dev Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap');

        :root {
            --bg-term: #000000;
            --bg-header: #050505;
            
            --text-main: #e4e4e7;
            --text-meta: rgba(255, 255, 255, 0.40);
            
            /* Яркие сочные цвета префиксов без плашек */
            --color-user: #00d2ff;   /* Яркий голубой */
            --color-plan: #c084fc;   /* Яркий фиолетовый для мыслей */
            --color-action: #facc15; /* Яркий сочный желтый для действий */
            --color-done: #34d399;   /* Яркий зеленый для завершения */
            --color-system: #f87171; /* Яркий красный для системных/окружения */

            --user-bg: rgba(0, 210, 255, 0.16);
            --green-bg: rgba(16, 185, 129, 0.14);
            
            --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", sans-serif;
            --font-code: "SF Mono", Menlo, Monaco, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: transparent;
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .terminal-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-term);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        /* Верхняя панель */
        .terminal-header {
            flex-shrink: 0;
            background: var(--bg-header);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .window-dots {
            display: flex;
            align-items: center;
            gap: 6.5px;
        }

        .dot {
            width: 9.5px;
            height: 9.5px;
            border-radius: 50%;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .workspace-title {
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 2.5px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            color: #d4d4d8;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .source-filters {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: #71717a;
            font-family: var(--font-ui);
            font-size: 11px;
            font-weight: 500;
            padding: 2px 7px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .filter-btn:hover {
            color: #f4f4f5;
        }

        .filter-btn.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 8px;
            background: var(--green-bg);
            border-radius: 12px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 6px #10b981;
            animation: pulseDot 2s infinite;
        }

        .status-text {
            font-size: 10px;
            font-weight: 600;
            color: #34d399;
            letter-spacing: 0.3px;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.15); }
        }

        /* 
           ЛЕНТА СООБЩЕНИЙ:
           Базовый отступ 20px. Все блоки выровнены строго по левой координате!
        */
        .terminal-stream {
            flex: 1;
            padding: 20px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
            scrollbar-width: none;
            padding-bottom: 120px;
        }

        .terminal-stream::-webkit-scrollbar {
            display: none;
        }

        /* Обычные записи: 14px отступ совпадает с внутренним текстом плашки пользователя */
        .log-entry {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 14px;
            margin: 0;
            animation: fadeIn 0.16s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Мета-строка */
        .log-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            padding: 0;
            margin: 0;
        }

        .time-text {
            color: var(--text-meta);
            font-size: 10px;
            font-family: var(--font-code);
        }

        /* ЧИСТЫЙ ЯРКИЙ ЦВЕТНОЙ ПРЕФИКС БЕЗ КАКИХ-ЛИБО ПЛАШЕК */
        .badge {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            padding: 0;
            background: transparent !important; /* Никаких плашек */
            border-radius: 0;
        }

        /* Цветовая дифференциация префиксов */
        .badge-user { color: var(--color-user); }
        .badge-plan { color: var(--color-plan); }
        .badge-action { color: var(--color-action); }
        .badge-done { color: var(--color-done); }
        .badge-system { color: var(--color-system); }

        .title-text {
            font-size: 13.5px;
            line-height: 1.38;
            color: var(--text-main);
            font-weight: 400;
            letter-spacing: -0.15px;
            word-break: break-word;
            padding: 0;
            margin: 0;
        }

        /* Сообщение пользователя: мягкая заливка */
        .log-user {
            background: var(--user-bg);
            border-radius: 8px;
            padding: 12px 14px;
            margin: 0;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.08);
        }

        .log-user .badge {
            color: var(--color-user);
        }

        .log-user .title-text {
            color: #ffffff;
            font-weight: 500;
            font-size: 14.5px;
        }

        /* Завершенный шаг */
        .log-done .title-text {
            color: #6ee7b7;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .check-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            margin-top: 1px;
            flex-shrink: 0;
        }

        /* Нижняя строка */
        .terminal-footer {
            flex-shrink: 0;
            padding: 8px 20px;
            background: #030304;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: #71717a;
        }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 13px;
            background: #a1a1aa;
            vertical-align: middle;
            margin-left: 4px;
            animation: blink 1s step-start infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* =========================================================
           16-BIT REALISTIC PIXEL ART CAT (Canvas Rendered)
           ========================================================= */
        .pixel-buddy-wrapper {
            position: absolute;
            bottom: 24px;
            right: 22px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
            z-index: 30;
        }

        .pet-speech-cloud {
            background: #11131a;
            border-radius: 6px;
            padding: 4px 9px;
            font-size: 10px;
            font-weight: 500;
            color: #38bdf8;
            margin-bottom: 4px;
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.85);
            animation: petBounce 3s ease-in-out infinite;
        }

        @keyframes petBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2.5px); }
        }

        #cat-canvas {
            width: 120px;
            height: 90px;
            image-rendering: pixelated;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.9));
        }

        /* Canvas Confetti */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <!-- Confetti layer for milestone celebration -->
        <canvas id="confetti-canvas"></canvas>

        <!-- Header -->
        <div class="terminal-header">
            <div class="header-left">
                <div class="window-dots">
                    <div class="dot dot-red"></div>
                    <div class="dot dot-yellow"></div>
                    <div class="dot dot-green"></div>
                </div>
                <span class="workspace-title" id="project-tag">MULTI-AGENT</span>
            </div>
            <div class="header-right">
                <div class="source-filters">
                    <button class="filter-btn active" onclick="setFilter('all')">all</button>
                    <button class="filter-btn" onclick="setFilter('pi')">orca</button>
                    <button class="filter-btn" onclick="setFilter('claude')">claude</button>
                    <button class="filter-btn" onclick="setFilter('codex')">codex</button>
                    <button class="filter-btn" onclick="setFilter('tmux')">tmux</button>
                </div>
                <div class="status-pill">
                    <span class="status-dot"></span>
                    <span class="status-text">LIVE</span>
                </div>
            </div>
        </div>

        <!-- Terminal Stream (идеальное выравнивание по левой линии) -->
        <div class="terminal-stream" id="stream-container">
            <!-- Dynamic entries -->
        </div>

        <!-- Реалистичный пиксельный котик, отрисовываемый пиксель-в-пиксель на канвасе -->
        <div class="pixel-buddy-wrapper">
            <div class="pet-speech-cloud" id="buddy-speech">typing code... ⚡</div>
            <canvas id="cat-canvas" width="120" height="90"></canvas>
        </div>

        <!-- Terminal Footer -->
        <div class="terminal-footer">
            <span id="footer-count">● 0 entries logged</span>
            <span>ready <span class="cursor"></span></span>
        </div>
    </div>

    <script>
        let rawEvents = [];
        let activeFilter = 'all';
        let lastEventCount = 0;

        const container = document.getElementById('stream-container');
        const projectTag = document.getElementById('project-tag');
        const footerCount = document.getElementById('footer-count');
        const buddySpeech = document.getElementById('buddy-speech');

        // Минималистичная SVG галочка с мягкой заливкой БЕЗ обводки
        const checkSvg = `
            <svg class="check-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="8" cy="8" r="8" fill="rgba(16, 185, 129, 0.2)"/>
                <path d="M4.8 8.2L6.9 10.3L11.2 5.8" stroke="#10b981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        `;

        function setFilter(source) {
            activeFilter = source;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const text = btn.innerText.toLowerCase();
                btn.classList.toggle('active', text === source || (source === 'pi' && text === 'orca'));
            });
            render();
        }

        function render() {
            container.innerHTML = '';
            const filtered = activeFilter === 'all'
                ? rawEvents
                : rawEvents.filter(ev => ev.source === activeFilter || (activeFilter === 'pi' && (ev.source === 'orca' || ev.source === 'pi')));

            filtered.forEach(ev => {
                const type = ev.type || 'action';
                const div = document.createElement('div');
                div.className = `log-entry log-${type}`;

                const badgeText = ev.badge || (type === 'user' ? 'USER PROMPT' : 'AGENT ACTION');
                const isDone = type === 'done';

                div.innerHTML = `
                    <div class="log-meta">
                        <span class="badge badge-${type}">${badgeText}</span>
                        <span class="time-text">${ev.time || ''}</span>
                    </div>
                    <div class="title-text">${isDone ? checkSvg : ''}${escapeHtml(ev.title || '')}</div>
                `;
                container.appendChild(div);
            });

            if (footerCount) {
                footerCount.innerText = `● ${filtered.length} entries streamed`;
            }

            container.scrollTop = container.scrollHeight;

            if (rawEvents.length > lastEventCount && rawEvents.length > 0) {
                const latest = rawEvents[rawEvents.length - 1];
                if (latest.type === 'done') {
                    triggerMiniConfetti();
                    if (buddySpeech) buddySpeech.innerText = 'task completed! 🎉';
                    setTimeout(() => { if (buddySpeech) buddySpeech.innerText = 'typing code... ⚡'; }, 3500);
                }
            }
            lastEventCount = rawEvents.length;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ============================================
        // 16-BIT REALISTIC PIXEL CAT RENDERER
        // ============================================
        const catCanvas = document.getElementById('cat-canvas');
        const catCtx = catCanvas.getContext('2d');
        catCtx.imageSmoothingEnabled = false;

        let animTick = 0;

        const CAT_FRAMES = [
            // Frame 0 (Typing left paw down)
            [
                "........ssss........ssss........",
                ".......sppppsssssssspppps.......",
                ".......sppppsssssssspppps.......",
                "......ssssssssssssssssssss......",
                "......ssssssssssssssssssss......",
                "......ssWWWWssssssssWWWWss......",
                "......ssWWKKssssssssWWKKss......",
                "......ssWWCCssssssssWWCCss......",
                "......ssssssssssnsssssssss......",
                "......sRRsssssmmmmmssssRRs......",
                ".......ssssssssssssssssss.......",
                "........ssssssssssssssss........",
                ".........ssssssWWssssss.........",
                ".........sssssWWWWsssss.........",
                ".........sssssWWWWsssss.tt......",
                ".......ppsssssWWWWsssssstt......",
                "......ppppssssWWWWsssssstt......",
                "......LLLLssssWWWWsssss.tt......",
                "......LLLLsssssssssssss.tt......",
                "......LLLL..ssss..ssss..tt......",
                "......LLLL..ssss..ssss.ttt......",
                "......................ttt.......",
            ],
            // Frame 1 (Typing right paw down)
            [
                "........ssss........ssss........",
                ".......sppppsssssssspppps.......",
                ".......sppppsssssssspppps.......",
                "......ssssssssssssssssssss......",
                "......ssssssssssssssssssss......",
                "......ssWWWWssssssssWWWWss......",
                "......ssWWKKssssssssWWKKss......",
                "......ssWWCCssssssssWWCCss......",
                "......ssssssssssnsssssssss......",
                "......sRRsssssmmmmmssssRRs......",
                ".......ssssssssssssssssss.......",
                "........ssssssssssssssss........",
                ".........ssssssWWssssss.........",
                ".........sssssWWWWsssss.........",
                ".........sssssWWWWsssss..tt.....",
                ".........sssssWWWWsssss..tt.....",
                "......LLLLssssWWWWsssss.tt......",
                "......LLLLppssWWWWsssss.tt......",
                "......LLLLppsssssssssss.tt......",
                "......LLLL..ssss..ssss.ttt......",
                "............ssss..ssss.ttt......",
                "................................",
            ]
        ];

        const COLOR_PALETTE = {
            's': '#2563eb', // Rich cat fur (electric blue)
            'p': '#f472b6', // Pink inner ears
            'W': '#ffffff', // Eye white / chest bib
            'K': '#09090b', // Deep pupil
            'C': '#00d2ff', // Cyan eye highlight
            'n': '#fda4af', // Cute nose
            'm': '#1d4ed8', // Dark mouth line
            'R': '#fb7185', // Rosy blush
            't': '#1d4ed8', // Tail
            'L': '#3f3f46', // Laptop body
        };

        function drawPixelArtCat() {
            catCtx.clearRect(0, 0, catCanvas.width, catCanvas.height);

            // 1. Draw Wooden Desk
            catCtx.fillStyle = '#1c1917';
            catCtx.fillRect(10, 68, 100, 18);
            catCtx.fillStyle = '#292524';
            catCtx.fillRect(10, 68, 100, 2);

            // 2. Draw Coffee Mug
            catCtx.fillStyle = '#f8fafc';
            catCtx.fillRect(16, 56, 12, 12);
            catCtx.fillStyle = '#e2e8f0';
            catCtx.fillRect(28, 59, 4, 6);
            catCtx.fillStyle = '#451a03';
            catCtx.fillRect(18, 57, 8, 2);

            // Coffee steam
            const steamOffset = (animTick % 30) / 10;
            catCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            catCtx.fillRect(20 + Math.sin(animTick * 0.1) * 2, 50 - steamOffset * 3, 3, 5);

            // 3. Draw Lit Glowing Laptop
            catCtx.fillStyle = '#27272a';
            catCtx.fillRect(36, 42, 38, 26);
            catCtx.fillStyle = '#090d16';
            catCtx.fillRect(38, 44, 34, 22);

            // Glowing code lines
            catCtx.fillStyle = '#00d2ff';
            catCtx.fillRect(40, 46, (animTick % 20 < 10 ? 20 : 14), 2);
            catCtx.fillStyle = '#10b981';
            catCtx.fillRect(40, 51, (animTick % 16 < 8 ? 26 : 18), 2);
            catCtx.fillStyle = '#c084fc';
            catCtx.fillRect(40, 56, (animTick % 24 < 12 ? 16 : 22), 2);
            catCtx.fillStyle = '#fbbf24';
            catCtx.fillRect(40, 61, 24, 2);

            // Screen glow aura
            catCtx.fillStyle = 'rgba(0, 210, 255, 0.08)';
            catCtx.fillRect(32, 40, 46, 30);

            // 4. Draw Animated Pixel Cat
            const frameIndex = Math.floor(animTick / 6) % 2;
            const matrix = CAT_FRAMES[frameIndex];
            const startX = 42;
            const startY = 16 + (Math.floor(animTick / 12) % 2 ? 1 : 0);
            const scale = 2;

            for (let row = 0; row < matrix.length; row++) {
                for (let col = 0; col < matrix[row].length; col++) {
                    const char = matrix[row][col];
                    if (char !== '.' && COLOR_PALETTE[char]) {
                        catCtx.fillStyle = COLOR_PALETTE[char];
                        catCtx.fillRect(startX + col * scale, startY + row * scale, scale, scale);
                    }
                }
            }

            animTick++;
            requestAnimationFrame(drawPixelArtCat);
        }

        drawPixelArtCat();

        // ============================================
        // Canvas Confetti
        // ============================================
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerMiniConfetti() {
            const colors = ['#00d2ff', '#10b981', '#c084fc', '#f59e0b', '#f472b6'];
            for (let i = 0; i < 35; i++) {
                particles.push({
                    x: canvas.width / 2 + (Math.random() * 90 - 45),
                    y: canvas.height * 0.35 + (Math.random() * 40 - 20),
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 1.2) * 4.5,
                    size: Math.random() * 3.5 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.012,
                });
            }
            if (particles.length <= 35) animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(idx, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
            });

            if (particles.length > 0) {
                requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function connect() {
            const ws = new WebSocket('ws://' + window.location.host + '/ws');

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.project) projectTag.innerText = data.project;
                    if (Array.isArray(data.events)) {
                        rawEvents = data.events;
                        render();
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            ws.onclose = () => {
                setTimeout(connect, 1500);
            };
        }

        connect();
    </script>
</body>
</html>
